    .green { color:#33df74; } .red { color:#ff7777; }

    .zone-yellow,.rr-fair { background:#876b17; }
    .zone-red,.rr-poor { background:#8a2525; }

  } else if (trig.includes("VOL")) {
    entry = "ENTRY: VWAP reclaim or first tight consolidation break";
    stop = "STOP: Below consolidation low";
    invalid = "INVALIDATION: Volume dries up under VWAP";
  }

  if (zone === "RED" || zone === "GRAY") {
    entry = "ENTRY: Watch only until chart improves";
    stop = "STOP: No trade plan until confirmation";
    invalid = "INVALIDATION: Risk stack remains weak";
  } else if (zone === "PRIME") {
    entry += " — PRIME setup";
  }

  if (session === "AH" || session === "PM") {
    invalid += " | Confirm liquidity during RTH";
  }

  return [entry, stop, invalid];
}

function parseHumanNumber(v) {
  const raw = String(v || "0").replaceAll(",", "").replace("$", "").trim().toUpperCase();
  if (!raw || raw === "UNKNOWN" || raw === "N/A") return 0;
  const mult = raw.endsWith("B") ? 1e9 : raw.endsWith("M") ? 1e6 : raw.endsWith("K") ? 1e3 : 1;
  const num = parseFloat(raw.replace(/[KMB]$/, ""));
  return Number.isFinite(num) ? num * mult : 0;
}
function tradeDecision(r) {
  const risk = String(r.risk_overall || "").toLowerCase();
  const offer = String(r.risk_offer || "").toLowerCase();
  const dil = String(r.risk_dil || "").toLowerCase();
  const zone = String(r.zone_status || "").toUpperCase();
  const trigger = String(r.trigger || "").toUpperCase();
  const session = String(r.session || "").toUpperCase();
  const qrv = parseHumanNumber(r.qual_rvol_display);
  const dvol = parseHumanNumber(r.dollar_vol_display);
  const pct = parseFloat(String(r.pct_display || "0").replace("%", "")) || 0;

  let action = "WATCH";
  let quality = "C";
  let warning = "";
  let cls = "action-watch";
  let qcls = "quality-c";

  function withSessionGate(obj) {
    if (obj.action === "TRADEABLE" && (session === "PM" || session === "AH")) {
      obj.action = "RTH CONFIRM";
      obj.warning = obj.warning || "Valid setup — confirm during RTH because PM/AH liquidity and spreads can distort signals.";
      obj.cls = "action-confirm";
    }
    return obj;
  }

  if (zone === "RED" || zone === "GRAY") {
    return {
      action: "WATCH ONLY",
      quality: "C",
      warning: "Weak trade zone. Wait for cleaner volume, VWAP reclaim, or stronger catalyst.",
      cls: "action-watch",
      qcls: "quality-c"
    };
  }

  if (risk === "high" && (offer === "high" || dil === "high")) {
    return {
      action: "RISK BLOCK",
      quality: "C",
      warning: "High dilution/offering stack. Treat as watch-only unless tape is exceptional.",
      cls: "action-block",
      qcls: "quality-c"
    };
  }

  if (trigger.includes("EXTENSION") || pct > 150) {
    return {
      action: "WATCH PULLBACK",
      quality: zone === "PRIME" ? "B" : "C",
      warning: "Avoid chasing vertical move. Only consider first controlled pullback or base.",
      cls: "action-pullback",
      qcls: zone === "PRIME" ? "quality-b" : "quality-c"
    };
  }

  if ((trigger.includes("NEWS") || trigger.includes("SEC")) && qrv >= 250 && dvol >= 1000000 && risk !== "high") {
    return withSessionGate({
      action: "TRADEABLE",
      quality: zone === "PRIME" ? "A+" : "B",
      warning: "",
      cls: "action-tradeable",
      qcls: zone === "PRIME" ? "quality-a" : "quality-b"
    });
  }

  if (trigger.includes("HOD") && qrv >= 150 && risk !== "high") {
    return withSessionGate({
      action: "TRADEABLE",
      quality: "B",
      warning: "Confirm breakout holds above prior high. Do not hold failed breakouts.",
      cls: "action-tradeable",
      qcls: "quality-b"
    });
  }

  if (zone === "PRIME" && risk !== "high") {
    return {
      action: (session === "PM" || session === "AH") ? "RTH CONFIRM" : "WATCH CONFIRMATION",
      quality: "B",
      warning: (session === "PM" || session === "AH")
        ? "Prime stack, but confirm during RTH before acting."
        : "Prime stack, but wait for VWAP/HOD confirmation before entry.",
      cls: (session === "PM" || session === "AH") ? "action-confirm" : "action-watch",
      qcls: "quality-b"
    };
  }

  return {
    action,
    quality,
    warning: "Needs confirmation. Do not chase without VWAP reclaim or tight base.",
    cls,
    qcls
  };
}
function adjustedZone(r) {
  const z = String(r.zone_status || "GRAY").toUpperCase();
  const risk = String(r.risk_overall || "").toLowerCase();
  const offer = String(r.risk_offer || "").toLowerCase();

}


function tickerHistory(r) {
  return ROWS
    .filter(x => x.ticker === r.ticker)
    .sort((a, b) => tsNum(b) - tsNum(a));
}
function priorRow(r) {
  const hist = tickerHistory(r);
  return hist.find(x => x.row_key !== r.row_key) || null;
}
function deltaPct(now, before) {
  const a = Number(now || 0);
  const b = Number(before || 0);
  return a - b;
}
function momentumShift(r) {
  const prev = priorRow(r);
  if (!prev) {
    return {
      label: "NEW",
      cls: "shift-flat",
      text: "First visible alert for this ticker in current ledger window.",
      bullets: ["No prior row to compare yet."]
    };
  }

  const pctDelta = deltaPct(r.pct_raw, prev.pct_raw);
  const qrvDelta = deltaPct(r.qual_rvol_raw, prev.qual_rvol_raw);
  const dvolDelta = deltaPct(r.dollar_vol_raw, prev.dollar_vol_raw);

  let improve = 0;
  let weaken = 0;
  const bullets = [];

  if (pctDelta > 3) { improve++; bullets.push(`% change improving +${pctDelta.toFixed(1)} pts`); }
  else if (pctDelta < -3) { weaken++; bullets.push(`% change fading ${pctDelta.toFixed(1)} pts`); }
  else bullets.push(`% change mostly flat (${pctDelta.toFixed(1)} pts)`);

  if (qrvDelta > 25) { improve++; bullets.push(`qRVOL accelerating +${qrvDelta.toFixed(1)}`); }
  else if (qrvDelta < -25) { weaken++; bullets.push(`qRVOL fading ${qrvDelta.toFixed(1)}`); }
  else bullets.push(`qRVOL stable (${qrvDelta.toFixed(1)})`);

  if (dvolDelta > 250000) { improve++; bullets.push(`$Vol expanding +${humanVol(dvolDelta)}`); }
  else if (dvolDelta < -250000) { weaken++; bullets.push(`$Vol lower ${humanVol(dvolDelta)}`); }
  else bullets.push(`$Vol stable (${humanVol(dvolDelta)})`);

  if (improve >= 2) {
    return { label: "IMPROVING", cls: "shift-up", text: "Momentum profile is improving versus prior alert.", bullets };
  }
  if (weaken >= 2) {
    return { label: "WEAKENING", cls: "shift-down", text: "Momentum profile is weakening versus prior alert.", bullets };
  }
  return { label: "STABLE", cls: "shift-flat", text: "Momentum is stable versus prior alert.", bullets };
}
function humanVol(v) {
  const sign = v < 0 ? "-" : "";
  const n = Math.abs(Number(v || 0));
  if (n >= 1e9) return sign + (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return sign + (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return sign + (n/1e3).toFixed(2) + "K";
  return sign + n.toFixed(0);
}

function entryTiming(r, decision, shift) {
  const trigger = String(r.trigger || "").toUpperCase();
  const session = String(r.session || "").toUpperCase();
  const zone = String(r.zone_status || "").toUpperCase();
  const risk = String(r.risk_overall || "").toLowerCase();
  const action = String(decision.action || "").toUpperCase();
  const momentum = String(shift.label || "").toUpperCase();

  let timing = "WAIT";
  let primary = "Wait for confirmation.";
  let secondary = "Avoid random entries.";
  let invalid = "Invalid if price loses VWAP and volume fades.";
  let style = "zone-gray";

  if (action.includes("RISK BLOCK")) {
    return {
      timing: "NO ENTRY",
      style: "action-block",
      primary: "No planned entry while risk block is active.",
      secondary: "Only observe tape; do not chase.",
      invalid: "Invalid until dilution/offering risk or tape context improves."
    };
  }

  if (action.includes("RTH CONFIRM")) {
    timing = "RTH CONFIRM";
    style = "action-confirm";
    primary = "Mark levels now; wait for RTH spread/liquidity confirmation.";
    secondary = "First valid entry is VWAP reclaim or clean base break during RTH.";
    invalid = "Invalid if open rejects VWAP or volume dries up.";
  } else if (trigger.includes("EXTENSION")) {
    timing = "PULLBACK ONLY";
    style = "action-pullback";
    primary = "Do not chase. Wait for first controlled pullback into VWAP/support shelf.";
    secondary = "Entry only after higher-low forms and reclaim candle confirms.";
    invalid = "Invalid if pullback slices through VWAP/support without reclaim.";
  } else if (trigger.includes("HOD")) {
    timing = "BREAKOUT TRIGGER";
    style = "action-tradeable";
    primary = "Entry on clean HOD break with volume expansion.";
    secondary = "Better entry is first retest/hold of breakout level.";
    invalid = "Invalid if HOD break fails and price loses breakout base.";
  } else if (trigger.includes("NEWS") || trigger.includes("SEC")) {
    timing = "VWAP / NEWS-HIGH";
    style = "action-tradeable";
    primary = "Entry on VWAP reclaim or break/hold above news-spike high.";
    secondary = "If extended, wait for base above VWAP instead of chasing.";
    invalid = "Invalid if news pop fades below VWAP.";
  } else if (trigger.includes("VOL")) {
    timing = "VWAP / BASE BREAK";
    style = "action-watch";
    primary = "Entry on VWAP reclaim or tight consolidation break.";
    secondary = "Needs volume expansion on trigger candle.";
    invalid = "Invalid if base breaks down or volume fades.";
  }

  if (momentum === "WEAKENING") {
    timing = timing + " — CAUTION";
    secondary = secondary + " Momentum is weakening; require stronger confirmation.";
  } else if (momentum === "IMPROVING" && !action.includes("RISK BLOCK")) {
    secondary = secondary + " Momentum improving; keep on active watch.";
  }

  if (zone === "RED" || zone === "GRAY" || risk === "high") {
    if (!action.includes("TRADEABLE") && !action.includes("RTH CONFIRM")) {
      timing = "WAIT";
      style = "action-watch";
      primary = "Wait for structure to improve before planning an entry.";
      secondary = "Current risk/zone stack is not clean enough.";
      invalid = "Invalid until risk stack or chart structure improves.";
    }
  }

  if (session === "AH" || session === "PM") {
    invalid = invalid + " Confirm again during RTH before acting.";
  }

  return { timing, style, primary, secondary, invalid };
}

function pctNum(r) {
  const n = parseFloat(String(r.pct_display || "0").replace("%", ""));
  return Number.isFinite(n) ? n : -999999;
}
function tsNum(r) {
  const raw = `${r.date_display || ""} ${r.time_display || ""}`;
  const t = Date.parse(raw.replaceAll("/", "-"));
  return Number.isFinite(t) ? t : 0;
}

function numFromDisplay(v) {
  const raw0 = String(v ?? "").trim();
  if (!raw0 || ["unknown","n/a","none"].includes(raw0.toLowerCase())) return 0;

  let raw = raw0.replace(/,/g, "").replace(/\$/g, "").replace(/%/g, "").trim().toUpperCase();
  let mult = 1;
  if (raw.endsWith("K")) { mult = 1000; raw = raw.slice(0, -1); }
  else if (raw.endsWith("M")) { mult = 1000000; raw = raw.slice(0, -1); }
  else if (raw.endsWith("B")) { mult = 1000000000; raw = raw.slice(0, -1); }

  const n = parseFloat(raw);
  return Number.isFinite(n) ? n * mult : 0;
}

function squeezeScore(r) {
  const si = numFromDisplay(r.si_pct_display);
  const ctb = Math.max(numFromDisplay(r.ctb_display), numFromDisplay(r.ctb_avg_display), numFromDisplay(r.ctb_max_display));
  const avail = numFromDisplay(r.available_display);
  const qrvol = numFromDisplay(r.qual_rvol_display);
  const dvol = numFromDisplay(r.dollar_vol_display);
  const pct = numFromDisplay(r.pct_display);
  const htb = String(r.htb_label || "").toLowerCase();
  const trig = String(r.trigger || "").toLowerCase();

  let score = 0;

  if (si >= 20) score += 30;
  else if (si >= 15) score += 24;
  else if (si >= 8) score += 14;
  else if (si >= 4) score += 7;

  if (ctb >= 100) score += 26;
  else if (ctb >= 50) score += 20;
  else if (ctb >= 20) score += 12;
  else if (ctb >= 8) score += 6;

  if (avail > 0 && avail <= 100000) score += 20;
  else if (avail > 0 && avail <= 500000) score += 12;
  else if (avail > 0 && avail <= 1000000) score += 6;

  if (htb.includes("htb")) score += 12;
  else if (htb.includes("limited")) score += 8;

  if (qrvol >= 100) score += 10;
  else if (qrvol >= 25) score += 7;
  else if (qrvol >= 5) score += 3;

  if (dvol >= 10000000) score += 8;
  else if (dvol >= 1000000) score += 5;

  if (pct >= 50) score += 7;
  else if (pct >= 25) score += 4;

  if (trig.includes("news") || trig.includes("sec")) score += 5;

  return Math.round(score);
}

function squeezeLabel(score) {
  if (score >= 78) return ["SQUEEZE A+", "squeeze-a"];
  if (score >= 55) return ["SQUEEZE WATCH", "squeeze-watch"];
  if (score >= 35) return ["BORROW WATCH", "borrow-watch"];
  return ["LOW SQUEEZE", "risk-unknown"];
}

function latestByTicker() {
  const m = new Map();
  [...ROWS].sort((a,b) => tsNum(b) - tsNum(a)).forEach(r => {

  });
  return m;
}

function runnerState(items) {
  const sorted = [...items].sort((a,b) => tsNum(b) - tsNum(a));
  const latest = sorted[0];
  const maxPct = Math.max(...sorted.map(pctNum));
  const latestPct = pctNum(latest);
  const alerts = sorted.length;
  const risk = String(latest.risk_overall || "").toLowerCase();

  if (risk === "high" && maxPct >= 50) return ["RISKY RUNNER", "runner-risky"];
  if (alerts >= 3 && latestPct >= maxPct * 0.78) return ["STILL ACTIVE", "runner-active"];
  if (alerts >= 2 && latestPct >= 25 && latestPct >= maxPct * 0.55) return ["REAWAKENING", "runner-reawake"];
  return ["COOLING", "runner-cooling"];
}

  });

    .map(([ticker, items]) => {

    })

}

async function loadMfInternalChart(sym, tf) {

  box.innerHTML = `<div class="facts" style="padding:18px">Loading MF internal ${esc(tf)} chart for ${esc(sym)}...</div>`;
  if (meta) meta.innerHTML = `Reading ${esc(mfChartFile(sym, tf))}`;

  try {
    const url = mfChartFile(sym, tf);
    const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });

    if (!res.ok) {
      throw new Error("missing candle file: " + url);
    }

    const payload = await res.json();
    const candles = Array.isArray(payload.candles) ? payload.candles.filter(c =>
      mfNum(c.open) !== null &&
      mfNum(c.high) !== null &&
      mfNum(c.low) !== null &&
      mfNum(c.close) !== null
    ) : [];

    if (!candles.length) {
      throw new Error("no valid candles in " + url);
    }

    renderMfInternalChart(sym, tf, payload, candles);
  } catch (err) {
    box.innerHTML = `
      <div class="facts" style="padding:18px;line-height:1.55">
        MF internal chart is not available for ${esc(sym)} ${esc(tf)} yet.<br>
        TradingView fallback is still available below.<br>
        <span style="color:#9fb4db">Reason: ${esc(err.message || String(err))}</span>
      </div>`;
    if (meta) meta.innerHTML = "Internal chart fallback mode";
  }
}


function mfDerivedLevels(candles) {
  const valid = Array.isArray(candles) ? candles.filter(c =>
    mfNum(c.open) !== null &&
    mfNum(c.high) !== null &&
    mfNum(c.low) !== null &&
    mfNum(c.close) !== null
  ) : [];

  if (valid.length < 5) return [];

  const recent = valid.slice(-20);
  const last = valid[valid.length - 1];
  const entry = mfNum(last.close);
  const recentLows = recent.map(c => mfNum(c.low)).filter(v => v !== null);
  let stop = Math.min(...recentLows);

  if (!Number.isFinite(entry) || !Number.isFinite(stop) || stop >= entry) {
    const lows = valid.slice(-60).map(c => mfNum(c.low)).filter(v => v !== null);
    stop = Math.min(...lows);
  }

  if (!Number.isFinite(entry) || !Number.isFinite(stop) || stop >= entry) return [];

  const risk = entry - stop;
  if (!Number.isFinite(risk) || risk <= 0) return [];

  const tp1 = entry + risk;
  const tp2 = entry + (risk * 2);
  const maxChase = entry + (risk * 0.25);

  return [
    { label: "ENTRY", value: entry, color: "#9ee6ff" },
    { label: "STOP", value: stop, color: "#ff5f72" },
    { label: "TP1", value: tp1, color: "#20d98b" },
    { label: "TP2", value: tp2, color: "#17b978" },
    { label: "MAX CHASE", value: maxChase, color: "#ffd166" },
  ];
}

function mfOverlaySummary(levels) {
  if (!levels || !levels.length) {
    return "Chart-derived levels unavailable. Need more valid candles.";
  }

  const get = name => levels.find(x => x.label === name);
  const entry = get("ENTRY");
  const stop = get("STOP");
  const tp1 = get("TP1");
  const tp2 = get("TP2");
  const chase = get("MAX CHASE");

  const fmt = x => x && Number.isFinite(Number(x.value)) ? Number(x.value).toFixed(4).replace(/0+$/, "").replace(/\.$/, "") : "n/a";

  return `Chart-derived levels · Entry ${fmt(entry)} · Stop ${fmt(stop)} · TP1 ${fmt(tp1)} · TP2 ${fmt(tp2)} · Max Chase ${fmt(chase)}`;
}

function renderMfInternalChart(sym, tf, payload, candles) {
  const box = document.getElementById("mfInternalChartBox");
  const meta = document.getElementById("mfInternalChartMeta");
  if (!box) return;

  const slice = candles.slice(-150);
  const w = 980;
  const h = 430;
  const padL = 54;
  const padR = 18;
  const padT = 22;
  const padB = 42;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;

  const levels = mfDerivedLevels(slice);
  const levelValues = levels.map(l => mfNum(l.value)).filter(v => v !== null);

  const highs = slice.map(c => mfNum(c.high)).filter(v => v !== null);
  const lows = slice.map(c => mfNum(c.low)).filter(v => v !== null);

  let hi = Math.max(...highs, ...levelValues);
  let lo = Math.min(...lows, ...levelValues);

  if (!Number.isFinite(hi) || !Number.isFinite(lo) || hi === lo) {
    hi = hi || 1;
    lo = lo || 0;
  }

  const range = hi - lo;
  hi += range * 0.04;
  lo -= range * 0.04;

  const y = price => padT + ((hi - price) / (hi - lo)) * chartH;
  const x = i => padL + (i / Math.max(1, slice.length - 1)) * chartW;
  const candleW = Math.max(2, Math.min(8, chartW / Math.max(1, slice.length) * 0.58));

  const gridVals = [hi, hi - (hi - lo) * 0.25, hi - (hi - lo) * 0.5, hi - (hi - lo) * 0.75, lo];

  let grid = "";
  gridVals.forEach(v => {
    const yy = y(v);
    grid += `<line x1="${padL}" y1="${yy.toFixed(2)}" x2="${w - padR}" y2="${yy.toFixed(2)}" stroke="#172335" stroke-width="1"/>`;
    grid += `<text x="8" y="${(yy + 4).toFixed(2)}" fill="#8ca4c4" font-size="11">${v.toFixed(2)}</text>`;
  });

  let body = "";
  slice.forEach((c, i) => {
    const open = mfNum(c.open);
    const high = mfNum(c.high);
    const low = mfNum(c.low);
    const close = mfNum(c.close);
    if (open === null || high === null || low === null || close === null) return;

    const xx = x(i);
    const yo = y(open);
    const yh = y(high);
    const yl = y(low);
    const yc = y(close);
    const up = close >= open;
    const color = up ? "#20d98b" : "#ff5f72";
    const top = Math.min(yo, yc);
    const bottom = Math.max(yo, yc);
    const height = Math.max(1, bottom - top);

    body += `<line x1="${xx.toFixed(2)}" y1="${yh.toFixed(2)}" x2="${xx.toFixed(2)}" y2="${yl.toFixed(2)}" stroke="${color}" stroke-width="1.2"/>`;
    body += `<rect x="${(xx - candleW / 2).toFixed(2)}" y="${top.toFixed(2)}" width="${candleW.toFixed(2)}" height="${height.toFixed(2)}" rx="1" fill="${color}" opacity="0.92"/>`;
  });

  const last = slice[slice.length - 1] || {};
  const lastClose = mfNum(last.close);
  const lastTime = last.time || "";

  let lastLine = "";
  if (lastClose !== null) {
    const yy = y(lastClose);
    lastLine = `
      <line x1="${padL}" y1="${yy.toFixed(2)}" x2="${w - padR}" y2="${yy.toFixed(2)}" stroke="#9ee6ff" stroke-width="1" stroke-dasharray="4 5" opacity="0.8"/>
      <text x="${w - 95}" y="${(yy - 6).toFixed(2)}" fill="#9ee6ff" font-size="12">Last ${lastClose.toFixed(2)}</text>`;
  }

  let overlays = "";
  levels.forEach((lvl, idx) => {
    const val = mfNum(lvl.value);
    if (val === null || val < lo || val > hi) return;

    const yy = y(val);
    const dash = lvl.label === "ENTRY" ? "6 4" : (lvl.label === "MAX CHASE" ? "2 5" : "4 5");
    const labelX = w - 150;
    const labelY = yy - 5 + (idx % 2 === 0 ? 0 : 13);

    overlays += `
      <line x1="${padL}" y1="${yy.toFixed(2)}" x2="${w - padR}" y2="${yy.toFixed(2)}" stroke="${lvl.color}" stroke-width="1.4" stroke-dasharray="${dash}" opacity="0.92"/>
      <rect x="${labelX - 6}" y="${labelY - 13}" width="132" height="18" rx="5" fill="#05080c" stroke="${lvl.color}" opacity="0.92"/>
      <text x="${labelX}" y="${labelY}" fill="${lvl.color}" font-size="11" font-weight="800">${lvl.label} ${val.toFixed(4).replace(/0+$/, "").replace(/\.$/, "")}</text>`;
  });

  box.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:430px;display:block;background:#05080c;border:1px solid #223041;border-radius:12px">
      <rect x="0" y="0" width="${w}" height="${h}" fill="#05080c"/>
      ${grid}
      ${body}
      ${overlays}
      ${lastLine}
      <text x="${padL}" y="${h - 14}" fill="#8ca4c4" font-size="12">${esc(sym)} · ${esc(tf)} · IBKR internal candles</text>
      <text x="${w - 250}" y="${h - 14}" fill="#8ca4c4" font-size="12">${esc(String(lastTime).replace("T", " ").slice(0, 19))}</text>
    </svg>`;

  if (meta) {
    const count = payload.bar_count || candles.length;
    const generated = payload.generated_at ? String(payload.generated_at).replace("T", " ").slice(0, 19) : "";
    meta.innerHTML = `IBKR internal candles · ${esc(count)} bars · updated ${esc(generated)}<br>${esc(mfOverlaySummary(levels))}`;
  }
}

<script id="mf-horizontal-cockpit-v1-js">
(function () {
  const MF_TAB_STORAGE_KEY = "mf_dashboard_active_tab_v1";
  const VALID_MF_TABS = new Set(["squeeze", "topgainers", "runners", "momentum"]);

  function savedMfTab() {
    try {
      const v = localStorage.getItem(MF_TAB_STORAGE_KEY);
      return VALID_MF_TABS.has(v) ? v : "topgainers";
    } catch (e) {
      return "topgainers";
    }
  }

  function saveMfTab(tab) {
    try {
      if (VALID_MF_TABS.has(tab)) {
        localStorage.setItem(MF_TAB_STORAGE_KEY, tab);
      }
    } catch (e) {}
  }

  const state = { tab: savedMfTab(), selected: "" };

  function h(v) {
    return String(v ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function n(v) {
    const x = Number(String(v ?? "").replace(/[$,%x,]/g, ""));
    return Number.isFinite(x) ? x : 0;
  }

  function fmtMoney(v) {
    const x = n(v);
    if (!x) return "";
    if (x >= 1) return "$" + x.toFixed(2);
    return "$" + x.toFixed(4);
  }

  function fmtPct(v) {
    const x = n(v);
    if (!x) return "";
    return x.toFixed(2) + "%";
  }

  function fmtVol(v) {
    const x = n(v);
    if (!x) return "";
    if (x >= 1e9) return (x/1e9).toFixed(2) + "B";
    if (x >= 1e6) return (x/1e6).toFixed(2) + "M";
    if (x >= 1e3) return (x/1e3).toFixed(2) + "K";
    return String(Math.round(x));
  }

  function tickerOf(r) {
    return String((r && (r.ticker || r.symbol)) || "").toUpperCase();
  }

  function latestLedgerByTicker() {
    const m = new Map();
    const rows = Array.isArray(ROWS) ? ROWS : [];
    rows.forEach(r => {
      const t = tickerOf(r);
      if (!t) return;
      if (!m.has(t)) {
        m.set(t, r);
        return;
      }
      const old = m.get(t);
      const oldPct = n(old.pct_display || old.pct_change || old.change_pct);
      const newPct = n(r.pct_display || r.pct_change || r.change_pct);
      if (newPct >= oldPct) m.set(t, r);
    });
    return m;
  }

  function squeezeScore(r) {
    const si = n(r.si_pct_display || r.si_pct || r.short_interest_pct);
    const ctb = n(r.ctb_display || r.ctb || r.ctb_avg);
    let score = 0;
    score += Math.min(si * 1.7, 55);
    score += Math.min(ctb / 4, 35);
    if (/HTB|HARD/i.test(String(r.htb_label || r.htb || ""))) score += 12;
    return Math.round(Math.max(0, Math.min(100, score)));
  }

  function liveUniverseSymbols() {
    const live = (typeof LIVE_UNIVERSE !== "undefined" && Array.isArray(LIVE_UNIVERSE)) ? LIVE_UNIVERSE : [];
    return new Set(live.map(r => tickerOf(r)).filter(Boolean));
  }

  function todayKey() {
    const live = (typeof LIVE_UNIVERSE !== "undefined" && Array.isArray(LIVE_UNIVERSE)) ? LIVE_UNIVERSE : [];
    if (live.length && live[0].ts_et) return String(live[0].ts_et).slice(0, 10);

    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function rowDateText(r) {
    return String(
      (r && (r.ts_et || r.time_et || r.time_display || r.idea_date || r.date || r.ts || r.timestamp)) || ""
    );
  }

  function hasTodayLedgerActivity(r) {
    const key = todayKey();
    const txt = rowDateText(r);
    return txt.includes(key);
  }

  function isCurrentContextTicker(symbol, row) {
    const liveSyms = liveUniverseSymbols();
    if (liveSyms.has(String(symbol || "").toUpperCase())) return true;
    if (row && hasTodayLedgerActivity(row)) return true;
    return false;
  }

  function getSqueezeRows(latestMap) {
    const liveSyms = liveUniverseSymbols();

    return [...latestMap.values()]
      .map(r => ({ type:"squeeze", symbol:tickerOf(r), row:r, score:squeezeScore(r) }))
      .filter(x => {
        // Current-context rule:
        // SQUEEZE only shows names active in the current live scanner universe.
        if (!liveSyms.has(x.symbol)) return false;

        const r = x.row || {};
        const si = n(r.si_pct_display || r.si_pct || r.short_interest_pct);
        const ctb = n(r.ctb_display || r.ctb || r.ctb_avg);
        const avail = n(r.available_display || r.available || r.available_shares);
        const htb = /HTB|HARD|LIMITED/i.test(String(r.htb_label || r.htb || ""));

        const borrowPressure = x.score >= 35 || si >= 10 || ctb >= 25 || htb || (avail > 0 && avail <= 100000);
        return borrowPressure;
      })
      .sort((a,b) => b.score - a.score)
      .slice(0, 14);
  }

  function getTopGainersRows(latestMap) {
    const live = (typeof LIVE_UNIVERSE !== "undefined" && Array.isArray(LIVE_UNIVERSE)) ? LIVE_UNIVERSE : [];
    return live
      .slice()
      .sort((a,b) => n(a.rank) - n(b.rank))
      .slice(0, 20)
      .map(r => ({
        type:"topgainers",
        symbol:tickerOf(r),
        live:r,
        row:latestMap.get(tickerOf(r)) || null,
        score:n(r.pct_change)
      }));
  }

  function getRunnerRows(latestMap) {
    const groups = new Map();
    const rows = Array.isArray(ROWS) ? ROWS : [];
    rows.forEach(r => {
      const t = tickerOf(r);
      if (!t) return;
      if (!groups.has(t)) groups.set(t, []);
      groups.get(t).push(r);
    });

    return [...groups.entries()]
      .map(([symbol, items]) => {
        const latest = latestMap.get(symbol) || items[0];
        const bestPct = Math.max(...items.map(x => n(x.pct_display || x.pct_change || x.change_pct)));
        const score = Math.round(bestPct + Math.min(items.length * 8, 40));
        return { type:"runners", symbol, row:latest, alerts:items.length, bestPct, score };
      })
      .filter(x => isCurrentContextTicker(x.symbol, x.row))
      .filter(x => x.bestPct >= 25 || x.alerts >= 2)
      .sort((a,b) => b.score - a.score)
      .slice(0, 14);
  }

  function getMomentumRows(latestMap) {
    return [...latestMap.values()]
      .filter(r => {
        const symbol = tickerOf(r);
        if (!isCurrentContextTicker(symbol, r)) return false;

        const trigger = String(r.trigger || r.trigger_reason || "").toUpperCase();
        const action = String(r.action || r.trade_action || "").toUpperCase();
        return trigger.includes("EXTENSION") || trigger.includes("VOL") || trigger.includes("HOD") ||
               trigger.includes("NEWS") || action.includes("MOMENTUM") || action.includes("TRADE");
      })
      .map(r => ({ type:"momentum", symbol:tickerOf(r), row:r, score:n(r.pct_display || r.pct_change || r.change_pct) }))
      .sort((a,b) => b.score - a.score)
      .slice(0, 14);
  }

  function rowsForTab(tab) {
    const latestMap = latestLedgerByTicker();
    if (tab === "squeeze") return getSqueezeRows(latestMap);
    if (tab === "runners") return getRunnerRows(latestMap);
    if (tab === "momentum") return getMomentumRows(latestMap);
    return getTopGainersRows(latestMap);
  }

  function showLiveOnlyDetail(item) {
    const r = item.live || {};
    const detail = document.getElementById("detail");
    if (!detail) return;

    detail.innerHTML = `
      <section class="mf-live-detail">
        <h2>${h(item.symbol)}</h2>
        <div class="muted">Live top-gainer universe only. This ticker may not have a qualified MF Volume card yet.</div>
        <div class="mf-live-grid">
          <div class="mf-live-cell"><div class="mf-live-k">Rank</div><div class="mf-live-v">#${h(r.rank || "")}</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">Price</div><div class="mf-live-v">${h(fmtMoney(r.price))}</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">% Change</div><div class="mf-live-v">${h(fmtPct(r.pct_change))}</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">Volume</div><div class="mf-live-v">${h(fmtVol(r.volume))}</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">RVOL</div><div class="mf-live-v">${h(Number(n(r.rvol)).toFixed(1))}x</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">1m Vol</div><div class="mf-live-v">${h(fmtVol(r.one_min_vol))}</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">5m Vol</div><div class="mf-live-v">${h(fmtVol(r.five_min_vol))}</div></div>
          <div class="mf-live-cell"><div class="mf-live-k">Session</div><div class="mf-live-v">${h(r.session || "")}</div></div>
        </div>
        <div class="warning-box" style="margin-top:16px">
          Raw scanner ticker only. Wait for Momentum / Squeeze / Elite / qualified alert confirmation before treating it as a trade setup.
        </div>
      </section>`;
  }

  function selectItem(item) {
    if (!item) return;
    state.selected = item.symbol;

    if (item.row && item.row.row_key && typeof selectRow === "function") {
      selectRow(item.row.row_key);
    } else {
      showLiveOnlyDetail(item);
    }

    document.querySelectorAll(".mf-ticker-tile").forEach(x => {
      x.classList.toggle("active", x.dataset.symbol === state.selected);
    });
  }

  function tileHtml(item) {
    const tabClass = "mf-tab-" + state.tab;
    let score = "";
    let meta1 = "";
    let meta2 = "";
    let pill = "";

    if (state.tab === "topgainers") {
      const r = item.live || {};
      score = fmtPct(r.pct_change);
      meta1 = `Price ${fmtMoney(r.price)} | Vol ${fmtVol(r.volume)}`;
      meta2 = `RVOL ${Number(n(r.rvol)).toFixed(1)}x | ${r.session || ""}`;
      pill = "LIVE TOP GAINER";
    } else if (state.tab === "squeeze") {
      const r = item.row || {};
      score = String(item.score);
      meta1 = `SI ${r.si_pct_display || ""} | CTB ${r.ctb_display || ""}`;
      meta2 = `Avail ${r.available_display || ""} | ${r.htb_label || ""}`;
      pill = item.score >= 78 ? "SQUEEZE A+" : "SQUEEZE WATCH";
    } else if (state.tab === "runners") {
      const r = item.row || {};
      score = Math.round(item.bestPct || 0) + "%";
      meta1 = `Alerts ${item.alerts || 0} | Best ${Math.round(item.bestPct || 0)}%`;
      meta2 = `${r.trigger_display || r.trigger || ""} | ${r.time_display || ""}`;
      pill = "RUNNER";
    } else {
      const r = item.row || {};
      score = r.pct_display || fmtPct(item.score);
      meta1 = `${r.trigger_display || r.trigger || ""} | ${r.qual_rvol_display || ""} qRVOL`;
      meta2 = `${r.action || ""} | ${r.time_display || ""}`;
      pill = "MOMENTUM";
    }

    return `
      <div class="mf-ticker-tile ${tabClass}" data-symbol="${h(item.symbol)}">
        <div class="mf-tile-top">
          <div class="mf-tile-symbol">${h(item.symbol)}</div>
          <div class="mf-tile-score">${h(score)}</div>
        </div>
        <div class="mf-tile-meta">${h(meta1)}</div>
        <div class="mf-tile-meta">${h(meta2)}</div>
        <span class="mf-tile-pill">${h(pill)}</span>
      </div>`;
  }

  function render(tab) {
    if (tab && VALID_MF_TABS.has(tab)) {
      state.tab = tab;
      saveMfTab(tab);
    }

    document.querySelectorAll(".mf-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.mfTab === state.tab);
    });

    const rows = rowsForTab(state.tab);
    const strip = document.getElementById("mfTickerStrip");
    const title = document.getElementById("mfStripTitle");
    const count = document.getElementById("mfStripCount");
    const asof = document.getElementById("mfAsOf");

    if (!strip || !title || !count) return;

    const titleMap = {
      squeeze: "ACTIVE SQUEEZE WATCH",
      topgainers: "LIVE TOP GAINERS",
      runners: "LAST KNOWN RUNNERS",
      momentum: "MOMENTUM"
    };

    title.innerText = titleMap[state.tab] || "TOP GAINERS";
    count.innerText = rows.length + " tickers";

    if (asof) {
      const live = (typeof LIVE_UNIVERSE !== "undefined" && Array.isArray(LIVE_UNIVERSE)) ? LIVE_UNIVERSE : [];
      const t = live.length ? (live[0].ts_et || "") : "";
      asof.innerText = t ? "LIVE UNIVERSE " + t : "AUTO 60s";
    }

    strip.innerHTML = rows.length
      ? rows.map(tileHtml).join("")
      : `<div class="mf-ticker-tile"><div class="mf-tile-meta">No symbols available in this category right now.</div></div>`;

    strip.querySelectorAll(".mf-ticker-tile[data-symbol]").forEach(el => {
      el.onclick = () => {
        const item = rows.find(x => x.symbol === el.dataset.symbol);
        selectItem(item);
      };
    });

    if (rows.length && (!state.selected || !rows.some(x => x.symbol === state.selected))) {
      selectItem(rows[0]);
    }
  }

  function wire() {
    document.querySelectorAll(".mf-tab").forEach(btn => {
      btn.onclick = () => render(btn.dataset.mfTab);
    });

    function findDashboardRowBySymbol(sym) {
      const target = String(sym || "").trim().toUpperCase();
      if (!target) return null;
      return (ROWS || []).find(r => String(tickerOf(r) || "").toUpperCase() === target) || null;
    }

    function forceCockpitSearchSync(sym) {
      const target = String(sym || "").trim().toUpperCase();
      if (!target) return false;

      // Search the full lower dashboard data first.
      const row = findDashboardRowBySymbol(target);

      // Find the best top tab containing this symbol.
      const tabOrder = ["momentum", "squeeze", "topgainers", "runners"];
      let foundTab = null;
      let foundItem = null;

      for (const tab of tabOrder) {
        try {
          const rows = rowsForTab(tab) || [];
          const hit = rows.find(x => String(x.symbol || tickerOf(x.row) || "").toUpperCase() === target);
          if (hit) {
            foundTab = tab;
            foundItem = hit;
            break;
          }
        } catch (e) {}
      }

      // Critical: set selected BEFORE render so render() does not auto-select row[0].
      state.selected = target;

      if (foundTab) {
        render(foundTab);
      }

      // Select the top-strip item after render rebuilds the tile list.
      if (foundItem) {
        try {
          selectItem(foundItem);
        } catch (e) {}
      } else if (row && row.row_key) {
        // If ticker exists only in lower detail data, at least select the detail panel.
        try { selectRow(row.row_key); } catch (e) {}
      }

      // Highlight and scroll tile after render/selectItem.
      setTimeout(() => {
        try {
          document.querySelectorAll(".mf-ticker-tile").forEach(x => {
            x.classList.toggle("active", String(x.dataset.symbol || "").toUpperCase() === target);
          });

          const tile = Array.from(document.querySelectorAll(".mf-ticker-tile"))
            .find(x => String(x.dataset.symbol || "").toUpperCase() === target);

          if (tile) {
            tile.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
          }
        } catch (e) {}
      }, 100);

      return !!foundTab || !!row;
    }

    try {
      const goBtn = document.getElementById("goBtn");
      const searchBox = document.getElementById("searchBox");

      if (goBtn && searchBox) {
        goBtn.onclick = () => {
          const q = String(searchBox.value || "").trim().toUpperCase();
          if (q) forceCockpitSearchSync(q);
        };

        searchBox.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") {
            const q = String(searchBox.value || "").trim().toUpperCase();
            if (q) forceCockpitSearchSync(q);
          }
        });
      }
    } catch (e) {}

    const search = document.getElementById("mfSearchBox");
    const go = document.getElementById("mfGoBtn");

    function doSearch() {
      const q = String(search && search.value || "").trim().toUpperCase();
      if (!q) return;

      const ledger = latestLedgerByTicker();
      if (ledger.has(q)) {
        const r = ledger.get(q);
        if (r && r.row_key && typeof selectRow === "function") selectRow(r.row_key);
        return;
      }

      const live = (typeof LIVE_UNIVERSE !== "undefined" && Array.isArray(LIVE_UNIVERSE)) ? LIVE_UNIVERSE : [];
      const item = live.find(x => tickerOf(x) === q);
      if (item) showLiveOnlyDetail({ symbol:q, live:item });
    }

    if (go) go.onclick = doSearch;
    if (search) search.onkeydown = e => {
      if (e.key === "Enter") doSearch();
    };

    render(state.tab || savedMfTab());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", wire);
  } else {
    wire();
  }
})();
</script>


<script id="mf-chart-label-rail-v1b-js">
(function () {
  function esc(v) {
    return String(v ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function parseLevels(text) {
    const raw = String(text || "");
    const out = {};
    const patterns = [
      ["entry", /Entry\s+([0-9]+(?:\.[0-9]+)?)/i],
      ["stop", /Stop\s+([0-9]+(?:\.[0-9]+)?)/i],
      ["tp1", /TP1\s+([0-9]+(?:\.[0-9]+)?)/i],
      ["tp2", /TP2\s+([0-9]+(?:\.[0-9]+)?)/i],
      ["chase", /Max\s+Chase\s+([0-9]+(?:\.[0-9]+)?)/i]
    ];
    patterns.forEach(([k, re]) => {
      const m = raw.match(re);
      if (m && m[1]) out[k] = m[1];
    });
    return out;
  }

  function pill(cls, label, value) {
    if (!value) return "";
    return `<span class="mf-level-pill ${cls}">${esc(label)} <strong>${esc(value)}</strong></span>`;
  }

  function rail(cls, label, value) {
    if (!value) return "";
    return `<div class="mf-rail-label ${cls}"><span>${esc(label)}</span><span>${esc(value)}</span></div>`;
  }

  function findChartPanel() {
    return [...document.querySelectorAll(".panel")].find(p => {
      const h3 = p.querySelector("h3");
      return h3 && /MF Internal Chart/i.test(h3.textContent || "");
    });
  }

  function enhanceChart() {
    const panel = findChartPanel();
    if (!panel || panel.dataset.chartRailV1b === "1") return;

    const levels = parseLevels(panel.textContent || "");
    if (!levels.entry && !levels.stop && !levels.tp1 && !levels.tp2 && !levels.chase) return;

    const body = panel.querySelector(".panel-body") || panel;
    const svg = body.querySelector("svg");

    const row = document.createElement("div");
    row.className = "mf-trade-level-row";
    row.innerHTML = `
      <span class="mf-level-title">TRADE LEVELS</span>
      ${pill("mf-level-tp", "TP2", levels.tp2)}
      ${pill("mf-level-tp", "TP1", levels.tp1)}
      ${pill("mf-level-chase", "MAX CHASE", levels.chase)}
      ${pill("mf-level-entry", "ENTRY", levels.entry)}
      ${pill("mf-level-stop", "STOP", levels.stop)}
    `;

    if (!body.querySelector(".mf-trade-level-row")) {
      body.insertBefore(row, body.firstChild);
    }

    if (svg && !body.querySelector(".mf-chart-wrap-upgraded")) {
      const railBox = document.createElement("div");
      railBox.className = "mf-level-rail";
      railBox.innerHTML = `
        ${rail("mf-rail-tp2", "TP2", levels.tp2)}
        ${rail("mf-rail-tp1", "TP1", levels.tp1)}
        ${rail("mf-rail-chase", "MAX CHASE", levels.chase)}
        ${rail("mf-rail-entry", "ENTRY", levels.entry)}
        ${rail("mf-rail-stop", "STOP", levels.stop)}
      `;

      const wrap = document.createElement("div");
      wrap.className = "mf-chart-wrap-upgraded";
      svg.parentNode.insertBefore(wrap, svg);
      wrap.appendChild(svg);
      wrap.appendChild(railBox);

      const note = document.createElement("div");
      note.className = "mf-chart-note";
      note.textContent = "Visual guide only. Follow Trade Zone status first. If Risk Block or No Entry is active, wait for confirmation instead of chasing.";
      wrap.parentNode.insertBefore(note, wrap.nextSibling);
    }

    panel.dataset.chartRailV1b = "1";
  }

  function schedule() {
    setTimeout(enhanceChart, 50);
    setTimeout(enhanceChart, 250);
    setTimeout(enhanceChart, 750);
  }

  const oldSelectRow = window.selectRow;
  if (typeof oldSelectRow === "function" && !window.__mfChartRailV1bWrapped) {
    window.selectRow = function () {
      const result = oldSelectRow.apply(this, arguments);
      schedule();
      return result;
    };
    window.__mfChartRailV1bWrapped = true;
  }

  document.addEventListener("click", function (e) {
    if (e.target && e.target.closest && e.target.closest(".mf-ticker-tile,.ticker-card,.smart-card")) {
      schedule();
    }
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
})();
</script>
